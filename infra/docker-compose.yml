services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms1344}
      POSTGRES_USER: ${POSTGRES_USER:-cms1344}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms1344_password}
    volumes:
      - cms1344-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: cms1344-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-cms1344}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cms1344}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cms1344_password}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://localhost:8080/api/health | grep '\"success\":true'"
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: cms1344-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "1344:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cms1344-data:
