services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: knue_common
      POSTGRES_USER: knue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knue_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knue -d knue_common"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
  backend:
    image: knue-common-backend:local
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/knue_common
      SPRING_DATASOURCE_USERNAME: knue
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-knue_password}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    expose:
      - "8080"
  frontend:
    image: knue-common-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:8080"
volumes:
  postgres-data:
