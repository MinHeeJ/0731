services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: cms_common
      POSTGRES_USER: cms_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_app_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_app -d cms_common"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: cms-common-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      DB_URL: jdbc:postgresql://database:5432/cms_common
      DB_USERNAME: cms_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cms_app_password}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health | grep success"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    image: cms-common-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ | grep KNUE"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
