services:
  database:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: knue_common
      POSTGRES_USER: knue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knue_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knue -d knue_common"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - common_foundation

  backend:
    image: knue-common-backend:0.1.0
    build:
      context: ../backend
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/knue_common
      SPRING_DATASOURCE_USERNAME: knue
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-knue_password}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - common_foundation
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: knue-common-frontend:0.1.0
    build:
      context: ../frontend
      dockerfile: Dockerfile
    pull_policy: build
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - common_foundation
    ports:
      - "13480:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  common_foundation:
    name: cms_1348_common_foundation
    driver: bridge
    ipam:
      config:
        - subnet: 10.134.8.0/24
