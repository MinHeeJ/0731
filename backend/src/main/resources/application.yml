server:
  port: 8080
spring:
  application:
    name: cms-common
  datasource:
    url: ${DB_URL:jdbc:postgresql://database:5432/cms_common}
    username: ${DB_USERNAME:cms_app}
    password: ${DB_PASSWORD:cms_app_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server.error.include-message: never
server.error.include-stacktrace: never
