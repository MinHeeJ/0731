spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/knue_common}
    username: ${SPRING_DATASOURCE_USERNAME:knue}
    password: ${SPRING_DATASOURCE_PASSWORD:knue_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
server:
  port: 8080
mybatis:
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
