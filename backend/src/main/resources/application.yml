spring:
  application:
    name: cms-common-foundation
  datasource:
    url: ${DB_URL:jdbc:postgresql://database:5432/cms}
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD:cms_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
cms:
  auth:
    session-cookie-name: SESSION
    session-hours: 8
