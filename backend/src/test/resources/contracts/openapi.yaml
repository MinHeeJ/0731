      type: object
      required:
      - message
      - fields
      properties:
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    ApiResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        data: {}
        error:
          $ref: '#/components/schemas/ApiError'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    UseYn:
      type: string
      enum:
      - Y
      - N
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - LOCKED
    EmploymentStatus:
      type: string
      enum:
      - ACTIVE
      - LEAVE
      - RETIRED
    OrganizationType:
      type: string
      enum:
      - UNIVERSITY
      - GRADUATE_SCHOOL
      - COLLEGE
      - DEPARTMENT
      - ADMIN_DEPARTMENT
    RoleAssignmentType:
      type: string
      enum:
      - POSITION
      - MANUAL
    UserRoleStatus:
      type: string
      enum:
      - ACTIVE
      - REVOKED
      - EXPIRED
    MenuType:
      type: string
      enum:
      - ROOT
      - GROUP
      - SCREEN
    PermissionTargetType:
      type: string
      enum:
      - ROLE
      - ORGANIZATION
      - USER
    PermissionDecision:
      type: string
      enum:
      - ALLOW
      - DENY
    CodeGroupStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    DetailCodeStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    SessionStatus:
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - REVOKED
    User:
      type: object
      properties:
        userId:
          type: string
        loginId:
          type: string
        staffNo:
          type: string
        useYn:
          $ref: '#/components/schemas/UseYn'
        status:
          $ref: '#/components/schemas/AccountStatus'
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'
        roles:
          type: array
          items:
            type: string
    Organization:
      type: object
      properties:
        organizationCode:
          type: string
        organizationName:
          type: string
        organizationType:
          $ref: '#/components/schemas/OrganizationType'
        useYn:
          $ref: '#/components/schemas/UseYn'
        status:
          $ref: '#/components/schemas/CodeGroupStatus'
    OrganizationRelation:
      type: object
      additionalProperties: true
    Role:
      type: object
      additionalProperties: true
    UserRole:
      type: object
      properties:
        assignmentId:
          type: integer
        userId:
          type: string
        roleCode:
          type: string
        assignmentType:
          $ref: '#/components/schemas/RoleAssignmentType'
        status:
          $ref: '#/components/schemas/UserRoleStatus'
        useYn:
          $ref: '#/components/schemas/UseYn'
    Menu:
      type: object
      properties:
        menuId:
          type: string
        parentMenuId:
          type: string
        menuType:
          $ref: '#/components/schemas/MenuType'
        useYn:
          $ref: '#/components/schemas/UseYn'
    MenuPermission:
      type: object
      properties:
        permissionId:
          type: integer
        targetType:
          $ref: '#/components/schemas/PermissionTargetType'
        decision:
          $ref: '#/components/schemas/PermissionDecision'
        useYn:
          $ref: '#/components/schemas/UseYn'
    CodeGroup:
      type: object
      properties:
        groupId:
          type: string
        status:
          $ref: '#/components/schemas/CodeGroupStatus'
        useYn:
          $ref: '#/components/schemas/UseYn'
    DetailCode:
      type: object
      properties:
        groupId:
          type: string
        codeValue:
          type: string
        status:
          $ref: '#/components/schemas/DetailCodeStatus'
        useYn:
          $ref: '#/components/schemas/UseYn'
    SessionUser:
      type: object
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            type: string
        sessionStatus:
          $ref: '#/components/schemas/SessionStatus'
    LoginRequest:
      type: object
      required:
      - loginId
      - password
      properties:
        loginId:
          type: string
        password:
          type: string
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Sort:
      name: sort
      in: query
      schema:
        type: string
