components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    KeywordParam:
      name: keyword
      in: query
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data: {}
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - success
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
      required:
      - code
      - message
    UseStatus:
      type: string
      enum:
      - ENABLED
      - DISABLED
    EffectiveStatus:
      type: string
      enum:
      - ACTIVE
      - EXPIRED
      - REVOKED
    PermissionAction:
      type: string
      enum:
      - READ
      - CREATE
      - UPDATE
      - DELETE
    DisplayStatus:
      type: string
      enum:
      - VISIBLE
      - HIDDEN
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        changeReason:
          type: string
        useStatus:
          $ref: '#/components/schemas/UseStatus'
      required:
      - name
      - changeReason
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        changeReason:
          type: string
        useStatus:
          $ref: '#/components/schemas/UseStatus'
      required:
      - name
      - changeReason
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        changeReason:
          type: string
        useStatus:
          $ref: '#/components/schemas/UseStatus'
      required:
      - name
      - changeReason
    UserRoleAssignment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        changeReason:
          type: string
        effectiveStatus:
          $ref: '#/components/schemas/EffectiveStatus'
      required:
      - name
      - changeReason
    MenuPermission:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        changeReason:
          type: string
        permissionAction:
          $ref: '#/components/schemas/PermissionAction'
      required:
      - name
      - changeReason
    MenuStructure:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        changeReason:
          type: string
      required:
      - name
      - changeReason
    Menu:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        changeReason:
