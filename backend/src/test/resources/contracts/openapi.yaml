        schema:
          type: string
        description: 조직명 필터
      - name: orgType
        in: query
        schema:
          type: string
        description: 조직유형 필터
      - name: useYn
        in: query
        schema:
          $ref: '#/components/schemas/UseYn'
        description: 사용여부 필터
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-roles:
      - authenticated
  /api/organizations/tree:
    get:
      tags:
      - organization
      operationId: getOrganizationTree
      summary: 조직 계층
      x-related-requirements:
      - REQ-002
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-roles:
      - authenticated
  /api/organizations/{orgCode}/relations:
    put:
      tags:
      - organization
      operationId: upsertOrganizationRelation
      summary: 조직 관계 기간 저장
      x-related-requirements:
      - REQ-002
      x-business-rules:
      - orgCode 기준 조직이 존재해야 한다
      - parentOrgCode는 자기 자신의 orgCode와 같을 수 없다
      - effectiveStartDate는 effectiveEndDate보다 늦을 수 없다
      - 동일 적용기간에 활성 상위조직이 둘 이상일 수 없다
      - R09 시스템관리자만 조직 관계를 등록·변경할 수 있다
      x-side-effects:
      - organization_relation_history에 상위조직 관계와 적용기간을 저장한다
      - 이전 관계가 변경되면 종료일을 보존한 새 이력 행을 만든다
      - change_history에 조직 관계 before_value와 after_value를 기록한다
      parameters:
      - $ref: '#/components/parameters/OrgCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRelationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-required-tests:
      - 'happy: R09가 parentOrgCode와 effectiveStartDate 요청 -> organization_relation_history 행이 저장되고 getOrganizationTree 후속
        조회가 새 parentOrgCode를 반환한다'
      - 'auth: R03 사용자가 조직 관계 저장 요청 -> HTTP 403을 반환하고 organization_relation_history 행 수가 유지된다'
      - 'validation: effectiveStartDate가 effectiveEndDate보다 늦은 요청 -> fieldErrors.effectiveStartDate 항목과 HTTP 400을 반환한다'
      - 'business: parentOrgCode가 orgCode와 같은 요청 -> 자기 자신 상위조직 금지 규칙으로 차단되고 활성 parent_org_code가 유지된다'
      - 'side-effect: 조직 관계 저장 성공 후 -> change_history.entity_name=organization_relation_history 행에 before_value와 after_value가
        존재한다'
      x-roles:
      - authenticated
  /api/roles:
    get:
      tags:
      - role
      operationId: listRoles
      summary: 역할 목록
      x-related-requirements:
      - REQ-003
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: roleCode
        in: query
        schema:
          $ref: '#/components/schemas/RoleCode'
        description: 역할코드 필터
      - name: roleName
        in: query
        schema:
          type: string
        description: 역할명 필터
      - name: useYn
        in: query
        schema:
          $ref: '#/components/schemas/UseYn'
        description: 사용여부 필터
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-roles:
      - authenticated
    put:
      tags:
      - role
      operationId: upsertRolePolicy
      summary: 역할 정책 저장
      x-related-requirements:
      - REQ-003
      x-business-rules:
