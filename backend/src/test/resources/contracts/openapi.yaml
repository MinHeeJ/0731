        - defaultSearchPeriod만 기본 검색기간 의미의 공통 환경설정 설정값으로 저장할 수 있다.
        - defaultSearchPeriod 값은 항목별 의미와 단위에 맞는 경우에만 저장한다.
        - defaultSearchPeriod 저장 요청은 설정 단위나 항목 의미 metadata를 변경할 수 없다.
