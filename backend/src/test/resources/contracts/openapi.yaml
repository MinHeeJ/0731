      x-related-requirements:
      - REQ-001
      - REQ-011
      - REQ-017
      - REQ-021
      - REQ-027
      x-business-rules:
      - KORUS 원천 인사정보 field는 요청 payload에 포함되어도 저장하지 않는다
      - use_yn은 Y 또는 N이어야 한다
      x-side-effects:
      - user_account.use_yn을 갱신한다
      - change_history에 변경 전후 값과 사유를 기록한다
      x-required-tests:
      - 'happy: 유효한 사용자 사용여부 변경 요청 -> 후속 조회에서 관련 table 변경값이 ApiResponse.data에 표시된다'
      - 'auth: 세션 없는 사용자 사용여부 변경 요청 -> HTTP 401과 ApiError.message가 반환된다'
      - 'validation: 필수 식별자 누락 -> ApiError.fields에 해당 field 오류가 포함된다'
      - 'business: KORUS 원천 인사정보 field는 요청 payload에 포함되어도 저장하지 않는다 위반 -> 대상 table의 기존 상태가 변경되지 않는다'
      - 'side-effect: 사용자 사용여부 변경 성공 -> change_history 또는 관련 상태 row가 생성된다'
