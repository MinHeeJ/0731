      x-related-requirements:
      - REQ-001
      x-business-rules:
      - 사용자 조회와 내부 계정 시스템 사용 여부 및 로컬 관리 속성을 등록·수정·삭제한다.
      - 관리자 권한만 등록할 수 있다
      x-side-effects:
      - local_user_account row를 생성한다
      - change_history에 등록 이력을 기록한다
      x-required-tests:
      - 'happy: 유효한 사용자 관리 저장 요청 -> local_user_account.name이 후속 조회에서 변경값으로 읽힌다'
      - 'auth: SYSTEM_VIEWER 변경 요청 -> 403 ApiResponse<ApiError>가 반환된다'
      - 'validation: name 공백 -> errors[0].field=name이 반환된다'
      - 'business: 참조 중인 사용자 관리 삭제 -> local_user_account row 상태가 변경 전으로 유지된다'
      - 'side-effect: 성공 변경 -> change_history.target_table=local_user_account 행이 생성된다'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: 등록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 검증
          content:
            application/json:
