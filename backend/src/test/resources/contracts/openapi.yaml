        - 'side-effect: longRunningTaskNoticeThreshold=<valid fixture> 저장이 성공한다 -> common_setting의 setting_key=longRunningTaskNoticeThreshold row가 존재하고 setting_value만 <valid fixture>로 갱신되어 후속 read에서 확인된다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [longRunningTaskNoticeThreshold]
              properties:
                longRunningTaskNoticeThreshold:
                  type: string
                  description: 장시간작업 안내 기준 변경값. 단위와 허용 범위는 OQ-001 확인 필요.
      responses:
        '200':
          description: 장시간작업 안내 기준 저장 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommonSetting'
        '400':
          description: 장시간작업 안내 기준 의미·단위 검증 실패
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
