openapi: 3.0.3
info:
  title: CMS-1344 test0731 API
  version: 0.2.0
servers:
- url: /
tags:
- name: auth
  description: 인증과 현재 사용자
- name: user
  description: 사용자 관리
- name: organization
  description: 조직 관리
- name: role
  description: 역할과 사용자 역할 관리
- name: menu
  description: 메뉴와 권한 관리
- name: code
  description: 공통코드 관리
paths:
  /api/health:
    get:
      tags:
      - auth
      operationId: getHealth
      summary: 상태 점검
      x-related-requirements:
      - REQ-001
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '503':
          description: DB 또는 application readiness 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/auth/login:
    post:
      tags:
      - auth
      operationId: login
      summary: 관리자 로그인
      x-related-requirements:
      - REQ-001
      x-business-rules:
      - loginId와 password는 비어 있을 수 없다
      - 시드 관리자 계정 admin/admin은 R09 시스템관리자 역할을 가져야 한다
      - system_use_yn이 Y인 내부 계정만 인증 세션을 받을 수 있다
      x-side-effects:
      - session 레코드를 AUTHENTICATED 상태로 저장한다
      - HttpOnly SameSite=Lax session cookie를 발급한다
      - 로그인 성공 시각을 internal_user.last_login_at에 기록한다
      x-state-transitions:
      - ANONYMOUS -> AUTHENTICATED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      x-required-tests:
      - 'happy: loginId=admin,password=admin 요청 -> session.status=AUTHENTICATED 행이 저장되고 /api/auth/me 후속 조회가 user.roleCodes에
        R09를 반환한다'
      - 'auth: system_use_yn=N 내부 계정으로 로그인 시도 -> HTTP 403을 반환하고 session 행이 생성되지 않는다'
      - 'validation: password 빈 문자열 요청 -> fieldErrors.password 항목과 HTTP 400을 반환한다'
      - 'business: admin/admin 시드 계정이 R09 역할을 갖지 않는 상태 -> 인증을 차단하고 internal_user.last_login_at 값이 변경되지 않는다'
      - 'side-effect: 로그인 성공 후 -> session.issued_at과 internal_user.last_login_at이 존재하고 change_history가 아닌 session 테이블에서 읽힌다'
  /api/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: 세션 로그아웃
      x-related-requirements:
      - REQ-001
      x-business-rules:
      - 인증된 session cookie가 없으면 로그아웃 처리하지 않는다
      - 이미 만료된 session은 중복 만료 이력을 만들지 않는다
      - 현재 사용자 자신의 session만 로그아웃할 수 있다
      x-side-effects:
      - session.invalidated_at을 현재 시각으로 저장한다
      - session.status를 EXPIRED로 갱신한다
      - session cookie 만료 헤더를 반환한다
      x-state-transitions:
      - AUTHENTICATED -> EXPIRED
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-required-tests:
      - 'happy: 인증 session cookie로 로그아웃 요청 -> session.status=EXPIRED로 저장되고 /api/auth/me 후속 조회가 HTTP 401을 반환한다'
      - 'auth: session cookie 없이 로그아웃 요청 -> HTTP 401을 반환하고 session.invalidated_at이 새로 기록되지 않는다'
      - 'validation: 변조된 session cookie 요청 -> ApiResponse.error.code=UNAUTHORIZED와 HTTP 401을 반환한다'
      - 'business: 이미 EXPIRED인 session으로 재요청 -> 중복 만료 처리를 막고 session.invalidated_at 기존 값이 유지된다'
      - 'side-effect: 로그아웃 성공 후 -> session.invalidated_at이 존재하고 Set-Cookie 만료 헤더가 응답에 포함된다'
      x-roles:
      - authenticated
  /api/auth/me:
    get:
      tags:
      - auth
      operationId: getCurrentUser
      summary: 현재 사용자
      x-related-requirements:
      - REQ-001
      - REQ-005
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-roles:
      - authenticated
  /api/users:
    get:
      tags:
      - user
      operationId: listUsers
      summary: 사용자 검색
      x-related-requirements:
      - REQ-001
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: employeeNo
        in: query
        schema:
          type: string
        description: 교번 필터
      - name: name
        in: query
        schema:
          type: string
        description: 성명 필터
      - name: departmentCode
        in: query
        schema:
          type: string
        description: 소속 필터
      - name: rankName
        in: query
        schema:
          type: string
        description: 직급 필터
      - name: employmentStatus
        in: query
        schema:
          type: string
        description: 재직상태 필터
      - name: roleCode
        in: query
        schema:
          $ref: '#/components/schemas/RoleCode'
        description: 역할 필터
      - name: useYn
        in: query
        schema:
          $ref: '#/components/schemas/UseYn'
        description: 사용여부 필터
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-roles:
      - authenticated
  /api/users/{userId}:
    get:
      tags:
      - user
      operationId: getUser
      summary: 사용자 상세
      x-related-requirements:
      - REQ-001
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-roles:
      - authenticated
  /api/users/{userId}/usage:
    patch:
      tags:
      - user
      operationId: updateUserUsage
      summary: 사용여부 변경
      x-related-requirements:
      - REQ-001
      x-business-rules:
      - KORUS 원천 인사 필드는 변경하지 않는다
      - R09 시스템관리자만 내부 계정의 system_use_yn을 변경할 수 있다
      - useYn은 Y 또는 N만 허용한다
      - 변경 사유가 없으면 사용여부 변경을 저장하지 않는다
      x-side-effects:
      - internal_user.system_use_yn을 저장한다
      - internal_user.updated_at과 updated_by를 갱신한다
      - change_history에 사용자 사용여부 before_value와 after_value를 기록한다
      x-state-transitions:
      - ACTIVE -> INACTIVE
      - INACTIVE -> ACTIVE
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserUsageRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-required-tests:
      - 'happy: R09가 useYn=N,changeReason=휴직 요청 -> internal_user.system_use_yn=N으로 저장되고 getUser 후속 조회가 N을 반환한다'
      - 'auth: R01 사용자가 사용여부 변경 요청 -> HTTP 403을 반환하고 internal_user.system_use_yn 기존 값이 유지된다'
      - 'validation: useYn=X 요청 -> fieldErrors.useYn 항목과 HTTP 400을 반환한다'
      - 'business: changeReason 누락 요청 -> 변경 사유 규칙으로 차단되고 internal_user.updated_at이 변경되지 않는다'
      - 'side-effect: 사용여부 변경 성공 후 -> change_history.entity_name=internal_user 행에 before_value와 after_value가 존재한다'
      x-roles:
      - authenticated
  /api/users/{userId}/roles:
    put:
      tags:
      - user
      operationId: replaceUserRoles
      summary: 사용자 업무 역할 저장
      x-related-requirements:
      - REQ-001
      - REQ-004
      x-business-rules:
      - KORUS 원천 인사 필드는 변경하지 않는다
      - roleCode는 R01부터 R09까지만 허용한다
      - 역할별 validFrom은 validTo보다 늦을 수 없다
      - R09 시스템관리자만 사용자 업무 역할을 변경할 수 있다
      x-side-effects:
      - 기존 user_role 활성 행을 요청 roles와 일치하도록 갱신한다
      - 새 수동 역할은 user_role에 ACTIVE 상태로 저장한다
      - change_history에 사용자 역할 before_value와 after_value를 기록한다
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserRolesRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - SessionCookieAuth: []
      x-required-tests:
      - 'happy: R09가 roles=[R03]와 changeReason 요청 -> user_role 활성 행이 요청 역할과 일치하고 getUser 후속 조회가 R03을 반환한다'
      - 'auth: R02 사용자가 업무 역할 저장 요청 -> HTTP 403을 반환하고 user_role 활성 행 집합이 유지된다'
      - 'validation: roleCode=R10 요청 -> fieldErrors.roles[0].roleCode 항목과 HTTP 400을 반환한다'
      - 'business: validFrom이 validTo보다 늦은 역할 요청 -> 기간 규칙으로 차단되고 user_role.valid_from 값이 유지된다'
      - 'side-effect: 업무 역할 저장 성공 후 -> change_history.entity_name=user_role 행에 before_value와 after_value가 존재한다'
      x-roles:
      - authenticated
  /api/organizations:
