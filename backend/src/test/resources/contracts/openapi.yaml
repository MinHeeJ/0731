openapi: 3.0.3
info:
  title: 교수업적평가시스템 공통기능 1차 API
  version: 0.1.0
servers:
- url: /
security:
- sessionCookie: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태
      x-related-requirements:
      - REQ-021
      responses:
        '200':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        status:
                          type: string
        '400':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
        '401':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
        '403':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
  /api/auth/login:
    post:
      operationId: login
      summary: 관리자 로그인
      x-related-requirements:
      - REQ-018
      - REQ-020
      responses:
        '200':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginUser'
        '400':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
        '401':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
        '403':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-rules:
      - admin/admin 시드 계정은 Docker Compose 직후 로그인 가능해야 한다
      - HttpOnly SameSite=Lax 세션 쿠키를 발급한다
      x-side-effects:
      - session 레코드를 ACTIVE 상태로 저장한다
      - Set-Cookie 헤더로 세션 식별자를 발급한다
      x-required-tests:
      - 'happy: userId=admin,password=admin -> session.status=ACTIVE이고 GET /api/auth/me가 admin을 반환한다'
      - 'auth: 잘못된 password -> 401과 ApiError.code=INVALID_CREDENTIALS를 반환한다'
      - 'validation: userId 빈 값 -> fieldErrors.userId가 반환된다'
      - 'business: DISABLED 계정 로그인 -> session 행이 생성되지 않는다'
      - 'side-effect: 성공 로그인 -> session 테이블에 user_id=admin 행이 존재한다'
      x-state-transitions:
      - none -> ACTIVE
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃
      x-related-requirements:
      - REQ-018
      responses:
        '200':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
        '400':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
        '401':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
        '403':
          description: ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      x-business-rules:
      - 인증된 ACTIVE 세션만 로그아웃할 수 있다
      x-side-effects:
      - session.status를 LOGGED_OUT으로 변경한다
      - 세션 쿠키 만료 헤더를 반환한다
      x-required-tests:
      - 'happy: 유효한 로그아웃 요청 -> 후속 조회에서 대상 필드 변경이 확인된다'
      - 'auth: R01 교원 세션으로 로그아웃 요청 -> 403과 ApiError.code=FORBIDDEN을 반환한다'
      - 'validation: changeReason 빈 값 -> fieldErrors.changeReason가 반환된다'
      - 'business: 요구 REQ-018의 불변 규칙 위반 -> 대상 레코드 상태가 변경되지 않는다'
      - 'side-effect: 성공 요청 -> change_history 행이 대상 entity_key로 생성된다'
      x-state-transitions:
      - ACTIVE -> LOGGED_OUT
