openapi: 3.0.3
info:
  title: CMS-1398 공통 환경설정 API
  version: 0.1.0
  description: >-
    CMN-FR-019 공통 환경설정 조회 및 변경 저장 계약이다. 문장은 한국어로 작성하고
    code identifiers, API paths, table names, enum values는 원문을 유지한다.
servers:
  - url: /
security:
  - existingSystemAuth: []
tags:
  - name: CommonSettings
    description: 공통 환경설정
paths:
  /api/system/common-settings:
    get:
      tags: [CommonSettings]
      operationId: getCommonSettings
      summary: 공통 환경설정 조회
      x-related-requirements: [REQ-001]
      x-related-fr: [CMN-FR-019]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SettingKeyFilterParam'
      responses:
        '200':
          description: 공통 환경설정 항목과 현재 값 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommonSettingsPage'
              examples:
                success:
                  value:
                    success: true
                    data:
                      items:
                        - settingKey: sessionIdleTime
                          settingValue: '<OQ-001>'
                          settingUnit: '<OQ-001>'
                          settingMeaning: 세션 유휴시간
                      page: 0
                      size: 20
                      totalElements: 5
                    error: null
        '400':
          description: 조회 조건 검증 실패
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'
        '401':
          description: 기존 시스템 인증 컨텍스트 없음
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'
    put:
      tags: [CommonSettings]
      operationId: updateCommonSettings
      summary: 공통 환경설정 저장
      x-related-requirements: [REQ-002, REQ-003, REQ-004, REQ-005, REQ-006, REQ-007, REQ-008, REQ-009]
      x-related-fr: [CMN-FR-019]
      x-business-rules:
        - 저장 대상은 sessionIdleTime, pageSize, defaultSearchPeriod, bulkQueryThreshold, longRunningTaskNoticeThreshold로 제한한다.
        - 각 설정값은 항목별 의미와 단위에 맞는 경우에만 저장한다.
        - 특정 사용자나 특정 업무만의 개별 환경값은 요청 payload와 persistence 대상에서 제외한다.
        - 세션 인증방식이나 대량처리 구현방식 선택은 이 저장 operation에서 결정하지 않는다.
      x-side-effects:
        - common_setting.setting_value를 변경 대상 setting_key별 현재 값으로 저장한다.
        - 저장 성공 후 getCommonSettings 재조회에서 변경된 setting_value가 반환된다.
        - 검증 실패 시 common_setting의 기존 setting_value를 유지한다.
      x-required-tests:
        - 'happy: sessionIdleTime 변경값을 저장하면 후속 getCommonSettings 응답의 common_setting.setting_value가 같은 값으로 반환된다.'
        - 'auth: 공통 환경설정 변경 권한이 없는 기존 인증 컨텍스트로 요청하면 403을 반환하고 common_setting.setting_value가 유지된다.'
        - 'validation: pageSize에 페이지당 조회건수 의미와 맞지 않는 값을 보내면 fieldErrors.pageSize가 반환되고 기존 pageSize 값이 유지된다.'
        - 'business: userId 또는 businessId override field가 포함되면 사용자별·업무별 개별 환경값 금지 규칙으로 차단되고 common_setting에 override row가 생성되지 않는다.'
        - 'side-effect: bulkQueryThreshold 저장 성공 뒤 getCommonSettings 재조회에서 common_setting의 bulkQueryThreshold setting_value가 변경값으로 확인된다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommonSettingsRequest'
            examples:
              partialUpdate:
                value:
                  sessionIdleTime: '<OQ-001>'
                  pageSize: '<OQ-001>'
      responses:
        '200':
          description: 공통 환경설정 저장 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommonSettingsPage'
              examples:
                success:
                  value:
                    success: true
                    data:
                      items:
                        - settingKey: pageSize
                          settingValue: '<OQ-001>'
                          settingUnit: '<OQ-001>'
                          settingMeaning: 페이지당 조회건수
                      page: 0
                      size: 20
                      totalElements: 5
                    error: null
        '400':
          description: 항목 의미·단위 또는 payload 검증 실패
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'
        '403':
          description: 변경 권한 없음
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'
  /api/system/common-settings/bulk-query-threshold:
    put:
      tags: [CommonSettings]
      operationId: bulkQueryThreshold
      summary: 대량조회 기준건수 설정값 저장
      description: '`SCR-COMMON-SETTINGS-EDIT` 화면에서 `bulkQueryThreshold` 값을 공통 환경설정으로 저장한다.'
      x-screen-id: SCR-COMMON-SETTINGS-EDIT
      x-ledger-api-path: PUT /api/system/common-settings
      x-related-requirements: [REQ-005, REQ-007, REQ-008]
      x-related-fr: [CMN-FR-019]
      x-business-rules:
        - bulkQueryThreshold만 대량조회 기준건수 의미의 공통 환경설정 설정값으로 저장할 수 있다.
        - bulkQueryThreshold 값은 항목별 의미와 단위에 맞는 경우에만 저장한다.
        - bulkQueryThreshold 저장 요청은 설정 단위나 항목 의미 metadata를 변경할 수 없다.
      x-side-effects:
        - common_setting에서 setting_key=bulkQueryThreshold row의 setting_value를 변경값으로 저장한다.
        - 저장 성공 후 GET /api/system/common-settings?settingKey=bulkQueryThreshold 재조회에서 변경된 setting_value가 반환된다.
        - 검증 또는 업무 규칙 실패 시 common_setting에서 setting_key=bulkQueryThreshold row의 기존 setting_value와 setting_unit을 유지한다.
      x-required-tests:
        - 'happy: setting_key=bulkQueryThreshold row가 있고 변경 권한이 있는 기존 인증 컨텍스트로 bulkQueryThreshold=<valid fixture>를 요청한다 -> PUT은 200을 반환하고 후속 GET /api/system/common-settings?settingKey=bulkQueryThreshold는 common_setting.setting_value=<valid fixture>를 반환한다.'
        - 'auth: 공통 환경설정 변경 권한이 없는 existingSystemAuth 컨텍스트로 bulkQueryThreshold=<valid fixture>를 요청한다 -> PUT은 403을 반환하고 후속 GET은 common_setting.setting_value가 요청 전 값 그대로임을 반환한다.'
        - 'validation: bulkQueryThreshold="invalid-unit"를 요청한다 -> PUT은 400을 반환하고 error.fieldErrors.bulkQueryThreshold가 존재한다.'
        - 'business: bulkQueryThreshold 요청에 settingUnit 변경 field를 함께 보낸다 -> PUT은 400을 반환하고 common_setting.setting_key=bulkQueryThreshold row의 setting_unit은 요청 전 값 그대로이다.'
        - 'side-effect: bulkQueryThreshold=<valid fixture> 저장이 성공한다 -> common_setting의 setting_key=bulkQueryThreshold row가 존재하고 setting_value만 <valid fixture>로 갱신되어 후속 read에서 확인된다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bulkQueryThreshold]
              properties:
                bulkQueryThreshold:
                  type: string
                  description: 대량조회 기준건수 변경값. 단위와 허용 범위는 OQ-001 확인 필요.
      responses:
        '200':
          description: 대량조회 기준건수 저장 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommonSetting'
        '400':
          description: 대량조회 기준건수 의미·단위 검증 실패
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'
        '403':
          description: 공통 환경설정 변경 권한 없음
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'

  /api/system/common-settings/default-search-period:
    put:
      tags: [CommonSettings]
      operationId: defaultSearchPeriod
      summary: 기본 검색기간 설정값 저장
      description: '`SCR-COMMON-SETTINGS-EDIT` 화면에서 `defaultSearchPeriod` 값을 공통 환경설정으로 저장한다.'
