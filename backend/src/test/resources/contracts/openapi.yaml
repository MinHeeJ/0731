      name: Authorization
      description: 기존 시스템 인증 컨텍스트를 전달한다. 이 계약은 REQ-010에 따라 세션 인증방식을 새로 결정하지 않는다.
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: collection GET 표준 page index. 공통 설정은 최대 다섯 항목이지만 collection 계약 일관성을 위해 제공한다.
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: collection GET 표준 page size. 실제 페이지당 조회건수 설정값 pageSize와 혼동하지 않는다.
      schema:
        type: integer
        minimum: 1
        default: 20
    SettingKeyFilterParam:
      name: settingKey
      in: query
      required: false
      description: 특정 공통 환경설정 key만 조회할 때 사용한다.
      schema:
        $ref: '#/components/schemas/CommonSettingKey'
  schemas:
    ApiResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          nullable: true
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    CommonSettingKey:
      type: string
      enum: [sessionIdleTime, pageSize, defaultSearchPeriod, bulkQueryThreshold, longRunningTaskNoticeThreshold]
      x-source: data-model.json#/entities/0/fields/0/enum_values
    CommonSetting:
      type: object
      required: [settingKey, settingValue, settingUnit, settingMeaning]
      properties:
        settingKey:
          $ref: '#/components/schemas/CommonSettingKey'
        settingValue:
          type: string
          description: 항목별 의미와 단위에 맞는 현재 값. 구체 type/range는 OQ-001 확인 필요.
        settingUnit:
          type: string
          description: 항목별 단위. 구체 enum은 OQ-001 확인 전 확정하지 않는다.
        settingMeaning:
          type: string
          description: 항목별 의미 설명.
    CommonSettingsPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommonSetting'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
    UpdateCommonSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        sessionIdleTime:
          type: string
          description: 세션 유휴시간 변경값. 단위와 허용 범위는 OQ-001 확인 필요.
        pageSize:
          type: string
          description: 페이지당 조회건수 변경값. 단위와 허용 범위는 OQ-001 확인 필요.
        defaultSearchPeriod:
          type: string
          description: 기본 검색기간 변경값. 단위와 허용 범위는 OQ-001 확인 필요.
