openapi: 3.0.3
info:
  title: 공통기능 1차 완료 목표 API
  version: 1.0.0
  description: 한국교원대학교 교수업적평가시스템 시스템 관리 9개 기능의 HTTP API 계약
servers:
- url: /
  description: frontend nginx 상대경로 /api reverse proxy
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 상태
      x-related-requirements:
      - REQ-096
      - REQ-058
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Health'
        '400':
          description: 400 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      parameters: []
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인 세션 생성
      x-related-requirements:
      - REQ-057
      - REQ-059
      - REQ-060
      - REQ-068
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '400':
          description: 400 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-rules:
      - 시드 관리자 admin/admin은 R09 시스템관리자 역할로 로그인할 수 있어야 한다
      - HttpOnly SameSite=Lax 세션 쿠키를 생성한다
      x-side-effects:
      - auth_session 레코드를 ACTIVE 상태로 저장한다
      - 로그인 성공 운영 로그를 request_id와 함께 남긴다
      x-required-tests:
      - 'happy: 유효한 요청으로 login를 호출한다 -> 후속 조회에서 auth_session.status 변경이 확인된다'
      - 'auth: 인증 세션이 없거나 R09 메뉴 권한이 없는 사용자가 login를 호출한다 -> 401 또는 403 ApiResponse 오류가 반환된다'
      - 'validation: loginId=빈 값 입력으로 login를 호출한다 -> ApiError.fields.loginId 값이 반환된다'
      - 'business: 시드 관리자 또는 활성 내부 계정만 로그인 가능 규칙을 위반해 login를 호출한다 -> auth_session 상태가 호출 전과 동일하게 유지된다'
      - 'side-effect: login 성공 호출 -> auth_session row와 로그인 성공 로그가 request_id로 추적 가능하다'
      parameters: []
      x-roles:
      - authenticated
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 세션 종료
      x-related-requirements:
      - REQ-068
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '400':
          description: 400 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      x-business-rules:
      - 현재 세션 소유자만 자신의 세션을 종료할 수 있다
      x-side-effects:
      - auth_session.status를 LOGGED_OUT으로 변경한다
      - 로그아웃 운영 로그를 request_id와 함께 남긴다
      x-state-transitions:
      - ACTIVE -> LOGGED_OUT
      x-required-tests:
      - 'happy: 유효한 요청으로 logout를 호출한다 -> 후속 조회에서 auth_session.status 변경이 확인된다'
      - 'auth: 인증 세션이 없거나 R09 메뉴 권한이 없는 사용자가 logout를 호출한다 -> 401 또는 403 ApiResponse 오류가 반환된다'
      - 'validation: sessionCookie=누락 입력으로 logout를 호출한다 -> ApiError.fields.sessionCookie 값이 반환된다'
      - 'business: 활성 세션만 로그아웃 가능 규칙을 위반해 logout를 호출한다 -> auth_session 상태가 호출 전과 동일하게 유지된다'
      - 'side-effect: logout 성공 호출 -> auth_session.status 변경 로그가 request_id로 추적 가능하다'
      parameters: []
      x-roles:
      - authenticated
  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: 현재 사용자 조회
      x-related-requirements:
      - REQ-068
      - REQ-062
      - REQ-077
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      parameters: []
      x-roles:
      - authenticated
  /api/users:
    get:
      operationId: listUsers
      summary: 사용자 검색
      x-related-requirements:
      - REQ-010
      - REQ-069
      - REQ-077
      security:
      - sessionCookie: []
      parameters:
      - name: staffNo
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: staffName
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: organizationCode
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: jobGrade
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: employmentStatus
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: roleCode
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: systemUseEnabled
        in: query
        required: false
        description: 검색 조건
        schema:
          type: boolean
      - &id001
        name: page
        in: query
        required: false
        description: 0부터 시작하는 페이지 번호
        schema:
          type: integer
      - &id002
        name: size
        in: query
        required: false
        description: 페이지 크기
        schema:
          type: integer
      - &id003
        name: sort
        in: query
        required: false
        description: 정렬 조건
        schema:
          type: string
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/User'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      x-roles:
      - authenticated
  /api/users/{userId}/usage:
    patch:
      operationId: updateUserUsage
      summary: 사용자 사용여부 저장
      x-related-requirements:
      - REQ-011
      - REQ-012
      - REQ-049
      - REQ-050
      - REQ-055
      - REQ-069
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '400':
          description: 400 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserUsageRequest'
      x-business-rules:
      - KORUS 원천정보 필드는 request body에 포함되어도 저장하지 않는다
      - systemUseEnabled만 로컬 DB에서 변경한다
      x-side-effects:
      - user_account.system_use_enabled 값을 저장한다
      - 관리자 변경 작업 운영 로그를 request_id로 남긴다
      x-state-transitions:
      - system_use_enabled true -> false 또는 false -> true
      x-required-tests:
      - 'happy: 유효한 요청으로 updateUserUsage를 호출한다 -> 후속 조회에서 user_account.system_use_enabled 변경이 확인된다'
      - 'auth: 인증 세션이 없거나 R09 메뉴 권한이 없는 사용자가 updateUserUsage를 호출한다 -> 401 또는 403 ApiResponse 오류가 반환된다'
      - 'validation: systemUseEnabled=null 입력으로 updateUserUsage를 호출한다 -> ApiError.fields.systemUseEnabled 값이 반환된다'
      - 'business: KORUS 원천정보 직접 수정 금지 규칙을 위반해 updateUserUsage를 호출한다 -> user_account 상태가 호출 전과 동일하게 유지된다'
      - 'side-effect: updateUserUsage 성공 호출 -> user_account 변경 로그가 request_id로 추적 가능하다'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: userId 식별자
      x-roles:
      - authenticated
  /api/users/{userId}/roles:
    put:
      operationId: replaceUserRoles
      summary: 사용자 업무 역할 저장
      x-related-requirements:
      - REQ-012
      - REQ-023
      - REQ-024
      - REQ-069
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/User'
        '400':
          description: 400 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      x-business-rules:
      - roleCodes는 R01~R09 중 하나 이상이어야 한다
      - 로그인 관리자를 처리자/승인자 성격으로 기록한다
      x-side-effects:
      - user_role_assignment rows를 갱신한다
      - 업무 역할 변경 운영 로그를 request_id로 남긴다
      x-state-transitions:
      - 기존 역할 집합 -> 요청 roleCodes 역할 집합
      x-required-tests:
      - 'happy: 유효한 요청으로 replaceUserRoles를 호출한다 -> 후속 조회에서 user_role_assignment.role_code 변경이 확인된다'
      - 'auth: 인증 세션이 없거나 R09 메뉴 권한이 없는 사용자가 replaceUserRoles를 호출한다 -> 401 또는 403 ApiResponse 오류가 반환된다'
      - 'validation: roleCodes=[] 입력으로 replaceUserRoles를 호출한다 -> ApiError.fields.roleCodes 값이 반환된다'
      - 'business: 유효하지 않은 roleCode 부여 금지 규칙을 위반해 replaceUserRoles를 호출한다 -> user_role_assignment 상태가 호출 전과 동일하게 유지된다'
      - 'side-effect: replaceUserRoles 성공 호출 -> user_role_assignment 변경 로그가 request_id로 추적 가능하다'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
        description: userId 식별자
      x-roles:
      - authenticated
  /api/organizations:
    get:
      operationId: listOrganizations
      summary: 조직 조회
      x-related-requirements:
      - REQ-013
      - REQ-015
      - REQ-016
      - REQ-070
      security:
      - sessionCookie: []
      parameters:
      - name: organizationCode
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: organizationName
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: parentOrganizationId
        in: query
        required: false
        description: 검색 조건
        schema:
          type: string
      - name: includeHierarchy
        in: query
        required: false
        description: 계층 포함 여부
        schema:
          type: boolean
      - *id001
      - *id002
      - *id003
      - name: filter
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Organization'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      x-roles:
      - authenticated
  /api/organization-relations/{relationId}:
    put:
      operationId: updateOrganizationRelation
      summary: 조직 관계 기간 저장
      x-related-requirements:
      - REQ-014
      - REQ-017
      - REQ-055
      - REQ-070
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 성공 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Organization'
        '400':
          description: 400 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '401':
          description: 401 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
        '403':
          description: 403 오류 응답
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRelationRequest'
      x-business-rules:
      - effectiveEndDate는 effectiveStartDate보다 빠를 수 없다
      - 상위조직 변경 이력은 조직 관계 적용기간 row로 보존한다
      x-side-effects:
      - organization_relation 적용기간과 parent_organization_id를 저장한다
      - 조직 관계 변경 운영 로그를 남긴다
      x-state-transitions:
      - previous relation period -> updated relation period
      x-required-tests:
      - 'happy: 유효한 요청으로 updateOrganizationRelation를 호출한다 -> 후속 조회에서 organization_relation.effective_start_date 변경이 확인된다'
      - 'auth: 인증 세션이 없거나 R09 메뉴 권한이 없는 사용자가 updateOrganizationRelation를 호출한다 -> 401 또는 403 ApiResponse 오류가 반환된다'
      - 'validation: effectiveEndDate=effectiveStartDate 이전 입력으로 updateOrganizationRelation를 호출한다 -> ApiError.fields.effectiveEndDate
        값이 반환된다'
      - 'business: 종료일이 시작일보다 빠른 관계 저장 금지 규칙을 위반해 updateOrganizationRelation를 호출한다 -> organization_relation 상태가 호출 전과 동일하게
        유지된다'
      - 'side-effect: updateOrganizationRelation 성공 호출 -> organization_relation 변경 로그가 request_id로 추적 가능하다'
      parameters:
      - name: relationId
        in: path
        required: true
        schema:
          type: string
        description: relationId 식별자
      x-roles:
      - authenticated
  /api/roles:
    get:
      operationId: listRoles
      summary: 역할 목록 조회
      x-related-requirements:
      - REQ-018
      - REQ-020
      - REQ-071
      security:
      - sessionCookie: []
      parameters:
      - name: roleCode
        in: query
        required: false
