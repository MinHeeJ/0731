                        $ref: '#/components/schemas/ApiError'

  /api/system/common-settings/page-size:
    put:
      tags: [CommonSettings]
      operationId: pageSize
      summary: 페이지당 조회건수 설정값 저장
      description: '`SCR-COMMON-SETTINGS-EDIT` 화면에서 `pageSize` 값을 공통 환경설정으로 저장한다.'
      x-screen-id: SCR-COMMON-SETTINGS-EDIT
      x-ledger-api-path: PUT /api/system/common-settings
      x-related-requirements: [REQ-003, REQ-007, REQ-008]
      x-related-fr: [CMN-FR-019]
      x-business-rules:
        - pageSize만 페이지당 조회건수 의미의 공통 환경설정 설정값으로 저장할 수 있다.
        - pageSize 값은 항목별 의미와 단위에 맞는 경우에만 저장한다.
        - pageSize 저장 요청은 설정 단위나 항목 의미 metadata를 변경할 수 없다.
      x-side-effects:
        - common_setting에서 setting_key=pageSize row의 setting_value를 변경값으로 저장한다.
        - 저장 성공 후 GET /api/system/common-settings?settingKey=pageSize 재조회에서 변경된 setting_value가 반환된다.
        - 검증 또는 업무 규칙 실패 시 common_setting에서 setting_key=pageSize row의 기존 setting_value와 setting_unit을 유지한다.
      x-required-tests:
        - 'happy: setting_key=pageSize row가 있고 변경 권한이 있는 기존 인증 컨텍스트로 pageSize=<valid fixture>를 요청한다 -> PUT은 200을 반환하고 후속 GET /api/system/common-settings?settingKey=pageSize는 common_setting.setting_value=<valid fixture>를 반환한다.'
        - 'auth: 공통 환경설정 변경 권한이 없는 existingSystemAuth 컨텍스트로 pageSize=<valid fixture>를 요청한다 -> PUT은 403을 반환하고 후속 GET은 common_setting.setting_value가 요청 전 값 그대로임을 반환한다.'
