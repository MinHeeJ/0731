openapi: 3.0.3
info:
  title: 교원사이트 공통기능 API
  version: 1.0.0
  description: CMS-1351 test0731 1차 완료 목표 HTTP API 계약
servers:
- url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 상태 확인
      x-related-requirements:
      - REQ-016
      - REQ-046
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인 세션 생성
      x-related-requirements:
      - REQ-012
      - REQ-027
      - REQ-036
      - REQ-037
      - REQ-039
      x-business-rules:
      - login_id와 password가 seed 또는 로컬 계정과 일치해야 한다
      - 비활성 계정은 로그인할 수 없다
      x-side-effects:
      - session row를 ACTIVE 상태로 저장한다
      - HttpOnly SameSite=Lax session cookie를 발급한다
      x-required-tests:
      - 'happy: login_id=admin 및 password=admin 요청 -> session table에 ACTIVE row가 저장되고 GET /api/auth/me가 R09를 반환한다'
      - 'auth: user_account.status=DISABLED인 계정 로그인 요청 -> HTTP 403과 ApiError.message가 반환된다'
      - 'validation: password 누락 -> ApiError.fields.password 오류가 포함된다'
      - 'business: login_id와 password가 seed 또는 로컬 계정과 일치해야 한다 위반 -> session table에 새 row가 생성되지 않는다'
      - 'side-effect: 로그인 세션 생성 성공 -> HttpOnly SameSite=Lax cookie와 session.status=ACTIVE row가 존재한다'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      x-state-transitions:
      - 없음 -> ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /api/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 세션 종료
      security:
      - sessionCookie: []
      x-related-requirements:
      - REQ-027
      - REQ-028
      x-business-rules:
      - ACTIVE session만 로그아웃할 수 있다
      x-side-effects:
      - session.status를 REVOKED로 갱신한다
      - 응답 cookie 만료를 반환한다
      x-required-tests:
      - 'happy: 유효한 로그아웃 세션 종료 요청 -> 후속 조회에서 관련 table 변경값이 ApiResponse.data에 표시된다'
      - 'auth: 세션 없는 로그아웃 세션 종료 요청 -> HTTP 401과 ApiError.message가 반환된다'
      - 'validation: 필수 식별자 누락 -> ApiError.fields에 해당 field 오류가 포함된다'
      - 'business: ACTIVE session만 로그아웃할 수 있다 위반 -> 대상 table의 기존 상태가 변경되지 않는다'
      - 'side-effect: 로그아웃 세션 종료 성공 -> change_history 또는 관련 상태 row가 생성된다'
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 검증 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      x-state-transitions:
      - ACTIVE -> REVOKED
      x-roles:
      - authenticated
