        - longRunningTaskNoticeThreshold만 장시간작업 안내 기준 의미의 공통 환경설정 설정값으로 저장할 수 있다.
        - longRunningTaskNoticeThreshold 값은 항목별 의미와 단위에 맞는 경우에만 저장한다.
        - longRunningTaskNoticeThreshold 저장 요청은 설정 단위나 항목 의미 metadata를 변경할 수 없다.
