        - 저장 성공 후 GET /api/system/common-settings?settingKey=defaultSearchPeriod 재조회에서 변경된 setting_value가 반환된다.
        - 검증 또는 업무 규칙 실패 시 common_setting에서 setting_key=defaultSearchPeriod row의 기존 setting_value와 setting_unit을 유지한다.
      x-required-tests:
        - 'happy: setting_key=defaultSearchPeriod row가 있고 변경 권한이 있는 기존 인증 컨텍스트로 defaultSearchPeriod=<valid fixture>를 요청한다 -> PUT은 200을 반환하고 후속 GET /api/system/common-settings?settingKey=defaultSearchPeriod는 common_setting.setting_value=<valid fixture>를 반환한다.'
        - 'auth: 공통 환경설정 변경 권한이 없는 existingSystemAuth 컨텍스트로 defaultSearchPeriod=<valid fixture>를 요청한다 -> PUT은 403을 반환하고 후속 GET은 common_setting.setting_value가 요청 전 값 그대로임을 반환한다.'
        - 'validation: defaultSearchPeriod="invalid-unit"를 요청한다 -> PUT은 400을 반환하고 error.fieldErrors.defaultSearchPeriod가 존재한다.'
        - 'business: defaultSearchPeriod 요청에 settingMeaning 변경 field를 함께 보낸다 -> PUT은 400을 반환하고 common_setting.setting_key=defaultSearchPeriod row의 setting_meaning은 요청 전 값 그대로이다.'
        - 'side-effect: defaultSearchPeriod=<valid fixture> 저장이 성공한다 -> common_setting의 setting_key=defaultSearchPeriod row가 존재하고 setting_value만 <valid fixture>로 갱신되어 후속 read에서 확인된다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [defaultSearchPeriod]
              properties:
                defaultSearchPeriod:
                  type: string
                  description: 기본 검색기간 변경값. 단위와 허용 범위는 OQ-001 확인 필요.
      responses:
        '200':
          description: 기본 검색기간 저장 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CommonSetting'
        '400':
          description: 기본 검색기간 의미·단위 검증 실패
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'
        '403':
          description: 공통 환경설정 변경 권한 없음
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        nullable: true
                      error:
                        $ref: '#/components/schemas/ApiError'

  /api/system/common-settings/long-running-task-notice-threshold:
    put:
      tags: [CommonSettings]
      operationId: longRunningTaskNoticeThreshold
      summary: 장시간작업 안내 기준 설정값 저장
