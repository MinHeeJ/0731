spring:
  datasource:
    url: jdbc:h2:mem:common_foundation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE\;CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: kr.ac.knue.performance.common.mybatis
  configuration:
    map-underscore-to-camel-case: true
